name: auto-milestone

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  assign-milestone:
    if: github.event.label.name == 'wave-sprint'
    runs-on: ubuntu-latest
    steps:
      - name: Assign the current wave milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          existing=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json milestone --jq '.milestone.title // ""')
          if [ -n "$existing" ]; then
            echo "Issue #$ISSUE_NUMBER already has milestone '$existing'; leaving it unchanged."
            exit 0
          fi

          milestone=$(gh api "repos/$REPO/milestones?state=open" \
            --jq 'map(select(.due_on != null)) | sort_by(.due_on) | reverse | .[0].title // ""')
          if [ -z "$milestone" ]; then
            echo "No open milestone with a due date found; nothing to assign."
            exit 0
          fi

          echo "Assigning milestone '$milestone' to issue #$ISSUE_NUMBER."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --milestone "$milestone"
